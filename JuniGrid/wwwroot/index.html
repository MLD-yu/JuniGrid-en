<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuniGrid</title>
    <base href="/" />

    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <!-- app.css is split by section; the link order matches the original file's cascade order (later files can override earlier ones) - do not reorder -->
    <link rel="stylesheet" href="css/base.css?v=1.1.3" />
    <link rel="stylesheet" href="css/shell.css?v=1.1.3" />
    <link rel="stylesheet" href="css/home.css?v=1.1.3" />
    <link rel="stylesheet" href="css/mods.css?v=1.1.3" />
    <link rel="stylesheet" href="css/effects.css?v=1.1.3" />
    <link rel="stylesheet" href="css/detail.css?v=1.1.3" />
    <link rel="stylesheet" href="css/nexus.css?v=1.1.3" />
    <link rel="stylesheet" href="css/misc.css?v=1.1.3" />
    <link rel="stylesheet" href="css/theme.css?v=1.1.3" />

    <style>
        /* Height uses 100% (not 100vh): with WebView2, when the window is maximized or under high DPI
           scaling, 100vh can diverge from the WebView's actual content height, causing the bottom of #app
           to be clipped by overflow:hidden so content cannot scroll to the bottom. Using 100% follows the
           real height chain of html/body and is more reliable. */
        html, body { height: 100%; }
        #app {
            height: 100%;
            border-radius: 10px;   /* matches the Win11 DWM window corner radius (about 8px) */
            overflow: hidden;
            /* Default dark brand color: guarantees the first frame is not a white flash (the splash animation covers it);
               the main UI skin (light/dark) is provided by the .jg-shell body itself and does not rely on the #app background */
            background: linear-gradient(135deg, #101e16 0%, #0b1510 100%);
        }
        /* DWM corners disappear when maximized; the CSS radius must zero out in sync */
        body.jg-max #app { border-radius: 0; }
        
        #blazor-error-ui {
            position: fixed;
            left: 16px; right: 16px; bottom: 16px;
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            background: #fde7e9;
            color: #c50f1f;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
        }
        #blazor-error-ui.show { display: block; }
        #blazor-error-ui a { color: #c50f1f; }
    </style>
</head>
<body>
    <!-- Runs first: add jg-booting immediately so .jg-shell is hidden from the first frame, avoiding a flash of light background -->
    <script>document.body.classList.add('jg-booting');</script>
    <!-- v1.1.1: Theme preset - synchronously read localStorage and set data-theme before Blazor mounts,
         so dark-theme users no longer see a flash of light on startup (writers: junigridJs.toggleTheme/applyTheme) -->
    <script>
        try {
            var jgTheme = localStorage.getItem('jg-theme');
            document.documentElement.dataset.theme = (jgTheme === 'light') ? 'light' : 'dark';
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <!-- Blazor mount point: keep it empty; Blazor renders the whole app into it once started -->
    <div id="app"></div>

    <!-- Fallback overlay shown before Blazor mounts: transparent, no longer draws the logo.
         The PCL-style splash is handled by WPF SplashWindow.xaml; this only prevents
         the shell from flashing through during the Blazor mount. -->
    <div id="jg-splash" aria-hidden="true"></div>

    <div id="blazor-error-ui">
        <span id="err-msg">JuniGrid failed to start</span> —
        <a href="" class="reload" onclick="location.reload();return false;">Reload</a>
        <a class="dismiss" style="float:right;cursor:pointer"
           onclick="document.getElementById('blazor-error-ui').classList.remove('show')">🗙</a>
    </div>

    <script>
        function showErr(msg) {
            const el = document.getElementById('blazor-error-ui');
            if (!el) return;
            document.getElementById('err-msg').textContent = msg;
            el.classList.add('show');
        }

        window.addEventListener('error', e =>
            showErr('JS error: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?')));
        window.addEventListener('unhandledrejection', e =>
            showErr('Promise rejection: ' + (e.reason?.message || e.reason || 'unknown')));

        setTimeout(() => {
            // Sign that Blazor mounted successfully: .jg-shell appears inside #app
            if (!document.querySelector('#app .jg-shell')) {
                showErr('Blazor startup timed out (5s) — component tree not mounted');
            }
        }, 5000);
    </script>

    <script src="js/vendor/gsap.min.js"></script>
    <script src="js/vendor/Flip.min.js"></script>
    <script src="js/vendor/ScrollTrigger.min.js"></script>
    <script>
        // v0.25.0: Disable mouse wheel page zoom (Ctrl+wheel) and Ctrl+plus/minus/0
        window.addEventListener('wheel', function (e) {
            if (e.ctrlKey) { e.preventDefault(); }
        }, { passive: false });
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '='
                              || e.key === '0' || e.key === 'Add' || e.key === 'Subtract')) {
                e.preventDefault();
            }
        });
    </script>
    <!-- v0.2.2: junigrid.*.js must come before blazor.webview.js - as soon as the Blazor engine loads it may render
         immediately and call back into junigridJs.* from OnAfterRenderAsync. Previously the engine loaded first with the
         two gsap CDN plugins in between; whenever the CDN was slow/down, junigridJs was undefined (TitleBar/MainLayout
         threw an unobserved "junigridJs was undefined" exception). The gsap plugins are now localized and the engine
         loads last, eliminating the race.
         (The original interop.js has been split by feature; core must load first - it defines the window.junigridJs base object) -->
    <script src="js/junigrid.core.js?v=1.1.13"></script>
    <script src="js/junigrid.splash.js?v=1.1.9"></script>
    <script src="js/junigrid.ui.js?v=1.1.9"></script>
    <script src="js/junigrid.detail.js?v=1.1.9"></script>
    <script src="js/junigrid.scroll.js?v=1.1.9"></script>
    <script src="js/junigrid.nexus.js?v=1.1.9"></script>
    <script src="js/junigrid.taskdock.js?v=1.1.9"></script>
    <script src="js/junigrid.widgets.js?v=1.1.9"></script>
    <script>junigridJs.splashInit();</script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
