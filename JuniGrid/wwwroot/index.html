<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuniGrid</title>
    <base href="/" />

    <link rel="stylesheet" href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" />
    <link rel="stylesheet" href="css/app.css?v=1.07.3" />

    <style>
        /* Height uses 100% (rather than 100vh): under WebView2, when the window is maximized or DPI scaling is applied,
           100vh can deviate from the WebView's actual content height, causing #app's bottom to be clipped by
           overflow:hidden so content cannot scroll to the end. Using 100% to follow the html/body actual height chain is more reliable. */
        html, body { height: 100%; }
        #app {
            height: 100%;
            border-radius: 10px;   /* Matches the Win11 DWM window rounded corners (~8px) */
            overflow: hidden;
            /* Default dark brand color: ensures the first frame isn't a white flash (the startup animation covers it);
               the main UI skin (light/dark) is provided by the .jg-shell body itself and doesn't rely on the #app background */
            background: linear-gradient(135deg, #101e16 0%, #0b1510 100%);
        }
        /* When maximized the DWM rounded corners disappear; the CSS rounded corners must reset to 0 in sync */
        body.jg-max #app { border-radius: 0; }
        @media (prefers-color-scheme: dark) {
            #app { background: linear-gradient(135deg, #1c1c1e 0%, #202225 100%); }
        }
        #blazor-error-ui {
            position: fixed;
            left: 16px; right: 16px; bottom: 16px;
            display: none;
            padding: 14px 18px;
            border-radius: 12px;
            background: #fde7e9;
            color: #c50f1f;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
        }
        #blazor-error-ui.show { display: block; }
        #blazor-error-ui a { color: #c50f1f; }
    </style>
</head>
<body>
    <!-- Runs first: apply jg-booting immediately so .jg-shell is hidden from the first frame, avoiding a flash of the light background -->
    <script>document.body.classList.add('jg-booting');</script>
    <!-- Blazor mount point: kept empty; once Blazor starts it renders the whole app into here -->
    <div id="app"></div>

    <!-- Fallback overlay shown before Blazor mounts: transparent, no longer draws a logo.
         The PCL-style splash is displayed by the WPF SplashWindow.xaml; this only prevents
         the shell from flashing at the moment Blazor mounts. -->
    <div id="jg-splash" aria-hidden="true"></div>

    <div id="blazor-error-ui">
        <span id="err-msg">JuniGrid failed to start</span> —
        <a href="" class="reload" onclick="location.reload();return false;">Reload</a>
        <a class="dismiss" style="float:right;cursor:pointer"
           onclick="document.getElementById('blazor-error-ui').classList.remove('show')">🗙</a>
    </div>

    <script>
        function showErr(msg) {
            const el = document.getElementById('blazor-error-ui');
            if (!el) return;
            document.getElementById('err-msg').textContent = msg;
            el.classList.add('show');
        }

        window.addEventListener('error', e =>
            showErr('JS error: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?')));
        window.addEventListener('unhandledrejection', e =>
            showErr('Unhandled promise rejection: ' + (e.reason?.message || e.reason || 'unknown')));

        setTimeout(() => {
            // Sign that Blazor mounted successfully: .jg-shell appears inside #app
            if (!document.querySelector('#app .jg-shell')) {
                showErr('Blazor startup timeout (5s) — component tree not mounted');
            }
        }, 5000);
    </script>

    <script src="js/vendor/gsap.min.js"></script>
    <script src="js/vendor/Flip.min.js"></script>
    <script src="js/vendor/ScrollTrigger.min.js"></script>
    <script>
        // v0.25.0: disable mouse-wheel page zoom (Ctrl+wheel) and Ctrl+plus/minus/0
        window.addEventListener('wheel', function (e) {
            if (e.ctrlKey) { e.preventDefault(); }
        }, { passive: false });
        window.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '='
                              || e.key === '0' || e.key === 'Add' || e.key === 'Subtract')) {
                e.preventDefault();
            }
        });
    </script>
    <!-- v0.2.2: interop.js must come before blazor.webview.js — as soon as the Blazor engine loads it may
         render immediately and call back into junigridJs.* from OnAfterRenderAsync. Previously the engine loaded first
         with the two gsap CDN plugins in between; if the CDN was slow/down, junigridJs was undefined
         (TitleBar/MainLayout threw unobserved "junigridJs was undefined" exceptions). gsap plugins are now local
         and the engine loads last, so the race is gone. -->
    <script src="js/interop.js?v=1.07.3"></script>
    <script>junigridJs.splashInit();</script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
